<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Add Vehicle - CarHelper</title>

        <style>
            * {
            box-sizing: border-box;
            }

            body 
            {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
            }

            header 
            {
            background: linear-gradient(135deg, #111827, #1f3b63);
            color: white;
            padding: 42px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
            }

            header h1 
            {
            margin: 0;
            font-size: 2.5rem;
            }

            header p 
            {
            margin-top: 10px;
            font-size: 1.05rem;
            color: #dbeafe;
            }

            nav 
            {
            background-color: #2f3f57;
            padding: 14px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }

            nav a 
            {
            color: white;
            text-decoration: none;
            margin: 0 18px;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
            display: inline-block;
            }

            nav a:hover 
            {
            background-color: rgba(255, 255, 255, 0.12);
            }

            .page-container
                {
            width: 92%;
            max-width: 760px;
            margin: 40px auto 60px;
            }

            .form-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
            border: 1px solid #e5e7eb;
            }

            .form-card h2 
            {
            margin: 0 0 10px 0;
            font-size: 2rem;
            color: #111827;
            }

            .form-subtext 
            {
            margin: 0 0 28px 0;
            color: #6b7280;
            line-height: 1.6;
            }

            form p 
            {
            margin-bottom: 18px;
            }

            form label 
            {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1f2937;
            }

            form input, form select, form textarea 
            {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            background: #fff;
            color: #111827;
            }

            form input:focus, form select:focus, form textarea:focus 
            {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            }

            .button-row 
            {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
            }

            .btn-primary, .btn-secondary 
            {
            display: inline-block;
            text-decoration: none;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 0.98rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            }

            .btn-primary 
            {
            background: #2563eb;
            color: white;
            }

            .btn-secondary 
            {
            background: #e5e7eb;
            color: #111827;
            }

            .btn-primary:hover, .btn-secondary:hover 
            {
            transform: translateY(-1px);
            opacity: 0.95;
            }

            .errorlist 
            {
            color: #b91c1c;
            margin: 6px 0 10px 0;
            padding-left: 18px;
            }

            @media (max-width: 768px) 
            {
                header h1 
                {
                    font-size: 2rem;
                }

                nav a  
                {
                margin: 6px 8px;
                }

                .form-card 
                {
                    padding: 22px;
                }

                .form-card h2 
                {
                    font-size: 1.7rem;
                }
            }
        </style>

    </head>

            <body>

                <header>
                    <h1>CarHelper</h1>
                    <p>Add a vehicle to your garage.</p>
                </header>

                <nav>
                    <a href="{% url 'home' %}">Home</a>
                    <a href="{% url 'add_vehicle' %}">Add Vehicle</a>
                    <a href="{% url 'create_post' %}">Create Post</a>
                    <a href="{% url 'logout' %}">Logout</a>
                </nav>

                <div class="page-container">
                    <div class="form-card">
                        <h2>Add Vehicle</h2>
                        <p class="form-subtext">
                        Enter your vehicle details below and see similar issues and repair guides of the communities
                        </p>

                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}

                            <div class="button-row">
                                <button type="submit" class="btn-primary">Save Vehicle</button>
                                <a href="{% url 'home' %}" class="btn-secondary">Back to Home</a>
                            </div>

                        </form>

                    </div>

                </div>

            </body>
</html>
