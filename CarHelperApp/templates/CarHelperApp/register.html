<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CarHelper</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #09111f, #13233d, #1f3b63);
            color: white;
        }
        .register-container {
            width: 100%; max-width: 460px;
            background: rgba(255,255,255,0.07);
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .brand { text-align: center; margin-bottom: 28px; }
        .brand h1 { font-size: 2.4rem; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .brand p { font-size: 0.9rem; color: #93c5fd; }
        h2 { text-align: center; margin-bottom: 24px; font-size: 1.3rem; color: #e2e8f0; font-weight: 600; }
        form p { margin-bottom: 16px; }
        form label { display: block; margin-bottom: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
        form input {
            width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px; outline: none; font-size: 15px;
            background: rgba(255,255,255,0.1); color: white;
            transition: border-color 0.2s ease;
        }
        form input:focus { border-color: #60a5fa; }
        button {
            width: 100%; padding: 13px; background: #2563eb; color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.2s ease; margin-top: 10px;
        }
        button:hover { background: #1d4ed8; }
        .login-link { margin-top: 20px; text-align: center; font-size: 0.9rem; color: #94a3b8; }
        .login-link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        .helptext { display: block; margin-top: 5px; font-size: 0.82rem; color: #94a3b8; line-height: 1.5; }
        .errorlist { color: #fca5a5; font-size: 0.85rem; padding-left: 16px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="brand">
            <h1>CarHelper</h1>
            <p>Join the community of drivers helping each other</p>
        </div>
        <h2>Create an Account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</body>
</html>
